stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  BACKEND_IMAGE_SHA: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  BACKEND_IMAGE_REF: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"

backend:test:
  stage: test
  image: python:3.12-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e backend pytest pytest-asyncio
  script:
    - cd backend
    - python -m pytest -q

backend:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - backend:test
  before_script:
    # GPU-runner firmware workaround. The amd64 builders are NVIDIA GPU hosts
    # that bind-mount host firmware into /lib, so kaniko can't remove /lib to
    # recreate the usr-merge symlink while those mounts are busy. The build
    # passes --ignore-path=/lib so kaniko leaves /lib untouched; that drops the
    # multilib dir holding the ELF loader (ld-linux-x86-64.so.2), so recreate
    # it here or every RUN fails with "no such file or directory".
    - mkdir -p /lib && ln -sfn /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu
  script:
    - mkdir -p /kaniko/.docker
    - >
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}'
      "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD"
      > /kaniko/.docker/config.json
    - |
      DESTINATIONS="--destination ${BACKEND_IMAGE_SHA} --destination ${BACKEND_IMAGE_REF}"
      if [ "$CI_COMMIT_BRANCH" = "deployment-dev" ]; then
        DESTINATIONS="$DESTINATIONS --destination ${CI_REGISTRY_IMAGE}/backend:deployment-dev"
      fi
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DESTINATIONS="$DESTINATIONS --destination ${CI_REGISTRY_IMAGE}/backend:main --destination ${CI_REGISTRY_IMAGE}/backend:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile" \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache/backend" \
        --ignore-path=/lib \
        $DESTINATIONS
